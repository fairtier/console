name: Audit

on:
  # Daily dependency audit: advisories land without commits, so the push-gated
  # audit in ci.yml alone would never see them on a quiet repo.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit
        run: bun audit --audit-level=high
